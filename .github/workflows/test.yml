name: Run Tests
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ahmadsaid/react-test -f ./client/Dockerfile.dev ./client
      - name: Run tests
        run: docker run -e CI=true ahmadsaid/react-test npm run test